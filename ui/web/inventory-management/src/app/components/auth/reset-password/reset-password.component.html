<div class="reset-password-container">
  <div class="reset-password-background">
    <div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
  </div>

  <div class="reset-password-card">
    <div class="reset-password-header">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L13.09 8.26L20 9L13.09 9.74L12 16L10.91 9.74L4 9L10.91 8.26L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Set New Password</h1>
        <p>Enter your new password below</p>
      </div>
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-password-form">
      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"></rect>
            <circle cx="12" cy="16" r="1" stroke="currentColor" stroke-width="2"></circle>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2"></path>
          </svg>
          New Password
        </label>
        <div class="input-container" [class.invalid]="isFieldInvalid('password')" [class.valid]="isFieldValid('password')">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your new password"
            class="form-input"
            [class.error]="isFieldInvalid('password')"
            [class.success]="isFieldValid('password')"
          />
          <div class="input-icon password-toggle" (click)="togglePasswordVisibility()">
            <ng-container *ngIf="!showPassword">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </ng-container>
            <ng-container *ngIf="showPassword">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.94 17.94C16.2306 19.243 14.1491 19.9649 12 20C5 20 1 12 1 12C2.24389 9.68192 3.96914 7.65661 6.06 6.06M9.9 4.24C10.5883 4.0789 11.2931 3.99836 12 4C19 4 23 12 23 12C22.393 13.1356 21.6691 14.2048 20.84 15.19M14.12 14.12C13.8454 14.4148 13.5141 14.6512 13.1462 14.8151C12.7782 14.9791 12.3809 15.0673 11.9781 15.0744C11.5753 15.0815 11.1747 15.0074 10.8019 14.8565C10.4291 14.7056 10.0927 14.4811 9.80385 14.1962C9.51497 13.9113 9.29039 13.5749 9.13951 13.2021C8.98862 12.8293 8.91454 12.4287 8.92163 12.0259C8.92872 11.6231 9.01691 11.2258 9.18088 10.8578C9.34484 10.4898 9.58124 10.1585 9.876 9.88M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </ng-container>
          </div>
        </div>
        
        <!-- Password Strength Indicator -->
        <div class="password-strength" *ngIf="resetPasswordForm.get('password')?.value">
          <div class="strength-bar">
            <div class="strength-fill" [style.width]="getPasswordStrengthWidth()" [style.background-color]="getPasswordStrength().color"></div>
          </div>
          <span class="strength-label" [style.color]="getPasswordStrength().color">{{ getPasswordStrength().label }}</span>
        </div>

        <div class="error-message" *ngIf="isFieldInvalid('password')">
          {{ getErrorMessage('password') }}
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirm_password" class="form-label">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"></rect>
            <circle cx="12" cy="16" r="1" stroke="currentColor" stroke-width="2"></circle>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2"></path>
          </svg>
          Confirm Password
        </label>
        <div class="input-container" [class.invalid]="isFieldInvalid('confirm_password')" [class.valid]="isFieldValid('confirm_password')">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirm_password"
            formControlName="confirm_password"
            placeholder="Confirm your new password"
            class="form-input"
            [class.error]="isFieldInvalid('confirm_password')"
            [class.success]="isFieldValid('confirm_password')"
          />
          <div class="input-icon password-toggle" (click)="toggleConfirmPasswordVisibility()">
            <ng-container *ngIf="!showConfirmPassword">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </ng-container>
            <ng-container *ngIf="showConfirmPassword">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.94 17.94C16.2306 19.243 14.1491 19.9649 12 20C5 20 1 12 1 12C2.24389 9.68192 3.96914 7.65661 6.06 6.06M9.9 4.24C10.5883 4.0789 11.2931 3.99836 12 4C19 4 23 12 23 12C22.393 13.1356 21.6691 14.2048 20.84 15.19M14.12 14.12C13.8454 14.4148 13.5141 14.6512 13.1462 14.8151C12.7782 14.9791 12.3809 15.0673 11.9781 15.0744C11.5753 15.0815 11.1747 15.0074 10.8019 14.8565C10.4291 14.7056 10.0927 14.4811 9.80385 14.1962C9.51497 13.9113 9.29039 13.5749 9.13951 13.2021C8.98862 12.8293 8.91454 12.4287 8.92163 12.0259C8.92872 11.6231 9.01691 11.2258 9.18088 10.8578C9.34484 10.4898 9.58124 10.1585 9.876 9.88M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </ng-container>
          </div>
        </div>
        <div class="error-message" *ngIf="isFieldInvalid('confirm_password')">
          {{ getErrorMessage('confirm_password') }}
        </div>
      </div>

      <!-- Error/Success Messages -->
      <div class="message-container" *ngIf="errorMessage || successMessage">
        <div class="error-message" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
            <path d="M15 9L9 15M9 9L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          {{ errorMessage }}
        </div>
        <div class="success-message" *ngIf="successMessage">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ successMessage }}
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="isLoading || resetPasswordForm.invalid">
        <div class="btn-content">
          <ng-container *ngIf="isLoading">
            <svg class="loading-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"></animate>
                <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"></animate>
              </circle>
            </svg>
          </ng-container>
          <ng-container *ngIf="!isLoading">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2"/>
            </svg>
          </ng-container>
          <span>{{ isLoading ? 'Updating Password...' : 'Update Password' }}</span>
        </div>
      </button>
    </form>

    <!-- Back to Login -->
    <div class="back-to-login">
      <p>Remember your password? <a routerLink="/login">Sign in here</a></p>
    </div>

    <!-- Back to Home -->
    <div class="back-home">
      <a routerLink="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Home
      </a>
    </div>
  </div>
</div>
