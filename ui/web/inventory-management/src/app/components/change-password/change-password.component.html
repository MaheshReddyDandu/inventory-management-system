<div class="change-password-container">
  <div class="change-password-card">
    <h2>Change Password</h2>
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="change-password-form">
      <!-- Old Password -->
      <div class="form-group">
        <label for="old_password">Old Password</label>
        <div class="input-container">
          <input
            [type]="showOldPassword ? 'text' : 'password'"
            id="old_password"
            formControlName="old_password"
            placeholder="Enter your old password"
            class="form-input"
          >
          <button type="button" class="toggle-btn" (click)="toggleOldPasswordVisibility()" tabindex="-1">
            {{ showOldPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div class="error-message" *ngIf="changePasswordForm.get('old_password')?.invalid && changePasswordForm.get('old_password')?.touched">
          Old password is required
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="input-container">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            id="new_password"
            formControlName="new_password"
            placeholder="Enter your new password"
            class="form-input"
          >
          <button type="button" class="toggle-btn" (click)="toggleNewPasswordVisibility()" tabindex="-1">
            {{ showNewPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div class="error-message" *ngIf="changePasswordForm.get('new_password')?.invalid && changePasswordForm.get('new_password')?.touched">
          New password is required (min 8 chars)
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="input-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirm_password"
            formControlName="confirm_password"
            placeholder="Confirm your new password"
            class="form-input"
          >
          <button type="button" class="toggle-btn" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div class="error-message" *ngIf="changePasswordForm.hasError('passwordsMismatch') && changePasswordForm.get('confirm_password')?.touched">
          Passwords do not match
        </div>
      </div>

      <!-- Error/Success Messages -->
      <div class="message-container" *ngIf="errorMessage || successMessage">
        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="isLoading || changePasswordForm.invalid">
        {{ isLoading ? 'Changing...' : 'Change Password' }}
      </button>
    </form>
  </div>
</div>
